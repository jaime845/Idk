      - name: Compilar APK
        working-directory: VTuberTTS
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp VTuberTTS/app/build/outputs/apk/debug/app-debug.apk VTuberTTS.apk
          gh release create "v${{ github.run_number }}.${{ github.run_attempt }}" VTuberTTS.apk --title "VTuber TTS v${{ github.run_number }}" --notes "APK listo para instalar" --repo "${{ github.repository }}"
