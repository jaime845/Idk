      - name: Compilar APK
        working-directory: VTuberTTS
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Mostrar versión del APK en el registro
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging VTuberTTS/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:" || true
      - name: Guardar el APK dentro de esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: VTuberStudio-v${{ github.run_number }}
          path: VTuberTTS/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp VTuberTTS/app/build/outputs/apk/debug/app-debug.apk VTuberTTS-v${{ github.run_number }}.apk
          gh release create "v${{ github.run_number }}.${{ github.run_attempt }}" VTuberTTS-v${{ github.run_number }}.apk --title "VTuber TTS v${{ github.run_number }}" --notes "APK listo para instalar" --repo "${{ github.repository }}"
